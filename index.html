<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/assets/risubard-startup.webp" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo_32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo_256.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <style id="startup-shell-style">
      #preloading { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 24px; background: #111827; color: #f7f8fc; font: 20px/1.5 system-ui, sans-serif; text-align: center; }
      #preloading img { width: min(80vw, 25rem); height: auto; border-radius: 12px; margin-bottom: 8px; }
      #preloading [data-startup-version] { margin-bottom: 20px; font-size: 14px; color: #aeb6cc; }
      #preloading > div { display: flex; align-items: center; }
      #preloading svg { width: 20px; height: 20px; margin-right: 12px; animation: startup-spin 1s linear infinite; }
      #preloading-status { margin-top: 8px; font-size: 16px; }
      #preloading-error { max-width: 90vw; color: #ffb4b4; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #preloading svg { animation: none; } }
    </style>
    <meta name="description" content="An AI frontend for both light and core users.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/fonts/interface/fonts.css" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none'; require-trusted-types-for 'script'; trusted-types plugin-policy;"> -->
    <title>RisuBard</title>
  </head>

  <body>
    <div id="app">
      <noscript>
        <div class="noscript">
          <h1>JavaScript is disabled</h1>
          <p>Please enable JavaScript to use this website.</p>
        </div>
      </noscript>
    </div>
    <!-- Visible before app code and styles load; handed off after the app logo is ready. -->
    <div id="preloading" class="w-full h-full flex justify-center items-center text-textcolor text-xl bg-gray-900 flex-col absolute top-0 left-0 z-50">
      <img data-startup-logo="preloader" class="mb-2 w-[min(80vw,25rem)] rounded-xl border border-darkborderc object-cover shadow-lg" src="/assets/risubard-startup.webp" fetchpriority="high" decoding="sync" alt="RisuBard" width="500" height="300" />
      <span data-startup-version class="mb-5 text-sm font-semibold tracking-[0.18em] text-textcolor2">v__RISUBARD_APP_VERSION__</span>
      <div class="flex flex-row items-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-textcolor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="preloading-title">Starting RisuBard</span>
      </div>
      <span id="preloading-status" role="status" aria-live="polite">Preparing the branding banner...</span>
      <p id="preloading-error" role="alert" hidden></p>
    </div>
    <script>
      try {
        if (localStorage.getItem('risu-lang') === 'ko') {
          document.documentElement.lang = 'ko'
          document.getElementById('preloading-title').textContent = 'RisuBard 시작'
          document.getElementById('preloading-status').textContent = '브랜딩 배너를 준비하는 중...'
        }
      } catch {}
    </script>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
